<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rosa Selvagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f8;
      color: #333;
    }

    header {
      background: #f8dce3;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #b03a5b;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #7a2c3f;
      font-weight: bold;
    }

    .banner {
      text-align: center;
      padding: 30px;
    }

    .banner img {
      max-width: 90%;
      border-radius: 10px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .produto {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .produto img {
      width: 100%;
      border-radius: 8px;
    }

    .produto h3 {
      margin: 10px 0 5px;
    }

    .produto p {
      color: #b03a5b;
      font-weight: bold;
    }

    .produto button {
      background: #b03a5b;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .produto button:hover {
      background: #8f2d47;
    }

    .carrinho {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #b03a5b;
      color: white;
      padding: 10px 15px;
      border-radius: 30px;
      font-weight: bold;
    }

    footer {
      background: #f8dce3;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="carrinho">
  🛒 Carrinho: <span id="contador">0</span>
</div>

<header>
  <h1>Rosa Selvagem 🌸</h1>
  <nav>
    <a href="#">Ofertas</a>
    <a href="#">Coleções</a>
    <a href="#">Novidades</a>
    <a href="#">Contato</a>
  </nav>
</header>

<section class="banner">
  <img src="img/banner.jpg" alt="Promoção Rosa Selvagem">
</section>

<section class="produtos">
  <div class="produto">
    <img src="img/produto1.jpg">
    <h3>Vestido Floral</h3>
    <p>R$ 89,90</p>
    <button onclick="adicionar()">Adicionar ao carrinho</button>
  </div>

  <div class="produto">
    <img src="img/produto2.jpg">
    <h3>Blusa Elegante</h3>
    <p>R$ 69,90</p>
    <button onclick="adicionar()">Adicionar ao carrinho</button>
  </div>

  <div class="produto">
    <img src="img/produto3.jpg">
    <h3>Saia Romântica</h3>
    <p>R$ 79,90</p>
    <button onclick="adicionar()">Adicionar ao carrinho</button>
  </div>
</section>

<footer>
  © 2026 Rosa Selvagem • Todos os direitos reservados
</footer>

<script>
  let total = 0;
  function adicionar() {
    total++;
    document.getElementById("contador").innerText = total;
  }
</script>

</body>
</html>
